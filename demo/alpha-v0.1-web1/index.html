<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111813">
  <link rel="icon" href="data:,">
  <title>MOROK · alpha v0.1</title>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111813; }
    body { touch-action: none; overscroll-behavior: none; }
    #canvas { display: block; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; align-content: center; justify-items: center;
      gap: 14px; padding: 20px; text-align: center; color: #ece0bc; background: #111813;
      font: 16px system-ui, sans-serif; }
    #loading strong { font: 600 24px Georgia, serif; }
    progress { inline-size: min(320px, 70vw); accent-color: #b99a5c; }
    #rotate { display: none; position: fixed; z-index: 1; top: 16px; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 85%; padding: 7px 10px; background: #111813e6; color: #ece0bc;
      pointer-events: none; font: 13px system-ui, sans-serif; text-align: center; }
    @media (orientation: portrait) and (pointer: coarse) { body.running #rotate { display: block; } }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="MOROK, игровое поле"></canvas>
  <div id="loading" role="status">
    <strong>MOROK · alpha v0.1</strong>
    <span id="status-text">Загружается игра</span>
    <progress id="progress" aria-label="Загрузка игры"></progress>
  </div>
  <p id="rotate">Для игры поверни телефон горизонтально</p>
  <noscript>Для запуска игры нужен JavaScript.</noscript>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17787024,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const progress = document.querySelector('#progress');
    const text = document.querySelector('#status-text');
    const missing = Engine.getMissingFeatures({ threads: false });
    const showError = (message) => {
      progress.hidden = true;
      text.textContent = message;
    };
    if (missing.length) {
      showError('Для запуска нужен браузер с WebGL 2. ' + missing.join(' '));
    } else {
      const engine = new Engine(config);
      engine.startGame({ onProgress(current, total) {
        if (total > 0) {
          progress.max = total;
          progress.value = current;
        }
      } }).then(() => {
        document.querySelector('#loading').remove();
        document.body.classList.add('running');
      }).catch((error) => {
        console.error(error);
        showError('Игра не загрузилась. Обнови страницу. ' + (error.message || error));
      });
    }
  </script>
</body>
</html>
