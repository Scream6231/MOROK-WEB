name: Deploy MOROK demo to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Web build
        run: |
          test -s demo/index.html
          for f in index.html index.js index.wasm index.pck; do test -s "demo/alpha-v0.1-web1/$f" || exit 1; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
